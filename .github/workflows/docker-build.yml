name: Build & Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            dockerfile: starflow-gateway/Dockerfile
            image: starflow-gateway
          - service: auth
            dockerfile: starflow-auth/Dockerfile
            image: starflow-auth
          - service: oss
            dockerfile: starflow-oss/starflow-oss-biz/Dockerfile
            image: starflow-oss
          - service: user
            dockerfile: starflow-user/starflow-user-biz/Dockerfile
            image: starflow-user
          - service: kv
            dockerfile: starflow-kv/starflow-kv-biz/Dockerfile
            image: starflow-kv
          - service: id
            dockerfile: starflow-distributed-id-generator/starflow-distributed-id-generator-biz/Dockerfile
            image: starflow-id
          - service: note
            dockerfile: starflow-note/starflow-note-biz/Dockerfile
            image: starflow-note
          - service: relation
            dockerfile: starflow-user-relation/starflow-user-relation-biz/Dockerfile
            image: starflow-user-relation
          - service: count
            dockerfile: starflow-count/starflow-count-biz/Dockerfile
            image: starflow-count
          - service: data-align
            dockerfile: starflow-data-align/Dockerfile
            image: starflow-data-align
          - service: search
            dockerfile: starflow-search/Dockerfile
            image: starflow-search
          - service: comment
            dockerfile: starflow-comment/starflow-comment-biz/Dockerfile
            image: starflow-comment

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
